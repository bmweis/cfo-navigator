name: QA

# Automated guards. Runs on every PR and on pushes to main, so dead code,
# off-brand colors/fonts, off-voice copy, dependency drift, and leaked secrets
# are all caught before anything ships. Mirrored live on /admin/checks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint — unused imports / dead code (pyflakes)
        run: python -m pyflakes linklib webapp scripts
      - name: Run the test suite (brand, voice, open-source sync, app, …)
        run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified   # fail only on secrets verified as live
