name: Secret scan (full history)

# Weekly backstop for qa.yml's secret-scan job, which (as of 2026-08-18)
# only checks each PR's own diff — fast, and the right default, since the
# rest of git history doesn't change between runs and this repo is small
# enough (172 commits, ~11MB .git) that re-scanning all of it on every PR
# was pure waste. This full-history sweep catches what a diff-scoped scan
# structurally can't: a secret already merged before diff-scoping existed,
# or introduced via any path that didn't go through a PR review. See
# .github/workflows/qa.yml's own comment for the full cost-optimization
# context this was split out of.
#
# Failure notification: GitHub emails the actor associated with a scheduled
# run's failure — in practice, whoever's GitHub notification settings have
# Actions failure emails enabled for this repo (Settings → Notifications →
# Actions, "Send notifications for failed workflows only"/"...for all
# workflows"). It does NOT require watching the repo or being a collaborator
# who ran anything — GitHub attributes a scheduled run to the workflow's
# most recent committer for notification purposes. Confirm the notification
# preference is actually on for the account that should see these before
# relying on email alone; the Actions tab's red X is the fallback either way.
#
# GitHub auto-disables a scheduled workflow after 60 days with no repository
# activity (any push, not just to this file) — silently, no notification.
# Worth checking `/admin/system/scripts`-style periodically (or the repo's
# Actions tab) if this repo ever goes quiet for two months, since a disabled
# schedule doesn't announce itself and looks identical to "nothing found."
on:
  schedule:
    # Monday ~08:17 UTC — off the exact hour/half-hour. (The daily Drive
    # backup trigger moved to a Railway Cron Service, 2026-08 — no longer a
    # GitHub Actions schedule to coordinate with here.)
    - cron: "17 8 * * 1"
  workflow_dispatch: {}

jobs:
  secret-scan-full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (TruffleHog) — full git history
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified   # fail only on secrets verified as live
