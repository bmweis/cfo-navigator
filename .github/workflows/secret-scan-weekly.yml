name: Secret scan (full history)

# Weekly backstop for qa.yml's secret-scan job, which (as of 2026-08-18)
# only checks each PR's own diff — fast, and the right default, since the
# rest of git history doesn't change between runs and this repo is small
# enough (172 commits, ~11MB .git) that re-scanning all of it on every PR
# was pure waste. This full-history sweep catches what a diff-scoped scan
# structurally can't: a secret already merged before diff-scoping existed,
# or introduced via any path that didn't go through a PR review. See
# .github/workflows/qa.yml's own comment for the full cost-optimization
# context this was split out of.
on:
  schedule:
    # Monday ~08:17 UTC — off the exact hour/half-hour, and deliberately
    # ahead of backup.yml's daily 09:00 UTC run, so the two scheduled jobs
    # don't collide.
    - cron: "17 8 * * 1"
  workflow_dispatch: {}

jobs:
  secret-scan-full-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (TruffleHog) — full git history
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified   # fail only on secrets verified as live
