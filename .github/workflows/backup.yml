name: Daily off-site backup

# Phase O — the reliable primary trigger for the Google Drive backup.
# linklib/backup.py's maybe_backup() is still wired into ~18 admin/save
# routes in webapp/app.py as a debounced bonus trigger, but that alone
# turned out not to fire reliably (it only rides Library/Archive-side admin
# traffic, which doesn't happen every week). This Action calls the same
# POST /admin/backup-now route by hand, on a schedule, so the backup no
# longer depends on which admin pages happen to get used.
#
# Bumped from weekly to daily (2026-08): Railway-native volume snapshots
# turned out to be unavailable on the current plan, so this Drive backup is
# the ONLY off-site recovery path for library.db — daily halves the
# worst-case data loss window versus weekly. linklib/backup.py's
# prune_old_backups() (added in the same change) keeps the Drive folder
# from growing without limit under the new cadence — see that function's
# docstring for the retention policy.
#
# Requires a repo secret LINKLIB_SAVE_TOKEN matching the live site's
# LINKLIB_SAVE_TOKEN — the same token RUNBOOK.md's manual curl example uses
# via X-Save-Token. Set it at Settings → Secrets and variables → Actions.
#
# /admin/backup-now returns a real non-2xx status on failure (503 if Drive
# isn't configured, 502 if the upload itself failed) — curl -f turns that
# into a failed Action run, visible in this repo's Actions tab, independent
# of whatever the in-app backup_log table says (if the site is unreachable,
# there's no in-app record at all, so this is a genuinely separate signal).
#
# Targets the Railway origin (*.up.railway.app), not bmweis.com, deliberately
# — see ARCHITECTURE.md's "publicly reachable Railway origin" note. The
# first live run against bmweis.com got a 403 from Cloudflare's Bot Fight
# Mode before the request ever reached the app (confirmed via the app's own
# auth path, which returns 401 for a bad token, never 403). Cloudflare was
# never meant to gate this call — X-Save-Token is the real auth boundary
# either way — so this routes around the CDN instead of trying to carve out
# a Bot Fight Mode exception for a rotating set of GitHub-runner IPs.
#
# Same caveat as secret-scan-weekly.yml: GitHub auto-disables a scheduled
# workflow after 60 days with no REPOSITORY activity (any push — the
# schedule firing daily does not itself count), silently, with no
# notification. Given this is the sole off-site recovery path for
# library.db, a Railway-only stretch with no code pushes for two months is
# the one scenario worth actively watching for — check the repo's Actions
# tab if that ever happens, since a disabled schedule looks identical to
# "quietly working" until a restore is actually needed.
on:
  schedule:
    - cron: "0 9 * * *"   # Daily 09:00 UTC — same time slot as the old weekly run
  workflow_dispatch: {}    # manual "Run workflow" button, for on-demand backups

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger POST /admin/backup-now
        # Always prints the real HTTP status + response body, success or
        # failure — plain `curl -f` only reports its own exit code, which
        # burned us twice in a row on 2026-08-10 (a 301 redirect and a
        # silent container-swap race both looked like "success" to `-f`
        # with no visible evidence either way in this log). Never trust
        # this job's green checkmark alone — cross-check
        # /admin/library/backup's banner + history table too.
        run: |
          response=$(curl -sS -w '\n%{http_code}' -X POST "https://cfo-navigator-production.up.railway.app/admin/backup-now" \
            -H "X-Save-Token: ${{ secrets.LINKLIB_SAVE_TOKEN }}")
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          echo "HTTP status: $status"
          echo "Response body:"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::POST /admin/backup-now returned HTTP $status"
            exit 1
          fi
